name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Real Postgres so the exclusion-constraint tests (#3) run for real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sambung
          POSTGRES_PASSWORD: sambung
          POSTGRES_DB: sambung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sambung -d sambung"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sambung:sambung@localhost:5432/sambung?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sambung/db db:generate

      - name: Apply database migrations
        run: pnpm --filter @sambung/db exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
