# Local dev services for Sambung. Free, offline, disposable.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also wipe the data volumes)
services:
  db:
    image: postgres:16-alpine
    container_name: sambung-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sambung
      POSTGRES_PASSWORD: sambung
      POSTGRES_DB: sambung
    ports:
      - "5432:5432"
    volumes:
      - sambung_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sambung -d sambung"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for photos (issue #39). Same contract as prod
  # (Cloudflare R2) - the API is configured purely by env, so swapping backends
  # is a .env change. --single-node skips cluster layout setup; --default-bucket
  # creates the key + bucket below on first boot. Dev-only credentials,
  # intentionally public (same story as the Postgres user above).
  # No healthcheck: the image is a bare static binary (no shell to probe with).
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: sambung-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GKdec0dedbadc0ffee5ca1ab1edeadbeef
      GARAGE_DEFAULT_SECRET_KEY: 6fc41d55e29f4d5cbb3b3f5b6f36f0e8ab1794a9d0c8e2b5f4a3d2c1b0e9f8a7
      GARAGE_DEFAULT_BUCKET: sambung-photos
    ports:
      - "3900:3900" # S3 API (presigned PUTs from the browser)
      - "3902:3902" # web endpoint (anonymous photo GETs in dev)
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - sambung_garage_meta:/var/lib/garage/meta
      - sambung_garage_data:/var/lib/garage/data

  # The reverse proxy, OPT-IN (`--profile edge`). Not part of `docker compose
  # up -d`: day-to-day dev talks to Vite on 5173 and Nest on 3000 directly, and
  # this only exists so `deploy/Caddyfile` can be RUN rather than read (#60,
  # ADR-0035). The Caddyfile is BIND-MOUNTED, not copied - a copy would drift
  # from the file that actually ships, which is the failure ADR-0019 exists to
  # prevent.
  #
  #   pnpm --filter @sambung/web build          # file_server needs a real dist
  #   docker compose --profile edge up -d
  #   pnpm --filter api og:doctor               # measures what it actually does
  #
  # SAMBUNG_API uses host.docker.internal because the API runs on the HOST here,
  # not in compose. In production both are containers and the default
  # (localhost:3000) is right, which is why it stays the default.
  edge:
    image: caddy:2-alpine
    container_name: sambung-edge
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      SAMBUNG_API: host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/sambung/web:ro

volumes:
  sambung_pgdata:
  sambung_garage_meta:
  sambung_garage_data:
